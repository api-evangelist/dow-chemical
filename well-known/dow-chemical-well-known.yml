  crawler User-Agent with an HTTP 403 "Site Temporarily Unavailable" interstitial on EVERY
  path, including ones it serves. A full browser header set (UA + Accept + Sec-Fetch-*)
  gets the real response. A prior probe that recorded 403 was reading the challenge, not
  the origin.
